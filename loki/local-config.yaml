auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  # Set a graceful shutdown period
  # http_server_shutdown_grace_period: 30s
  # grpc_server_shutdown_grace_period: 30s

common:
  instance_addr: 127.0.0.1 # Address to advertise Loki (can be important in clustered setups, ok for single node)
  path_prefix: /tmp/loki   # Base temporary path for Loki operations (compactor, etc.)
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks # Renamed from 'directory' for clarity
      rules_directory: /tmp/loki/rules   # Needed if you ever use rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2023-01-01 # Keep your original schema start date
      store: boltdb-shipper
      object_store: filesystem # Use the 'filesystem' store defined in common.storage
      schema: v11          # Keep your schema version
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /tmp/loki/index # Shipper's active index location
    cache_location: /tmp/loki/boltdb-cache  # Shipper's cache
    cache_ttl: 24h                          # Add a TTL for the cache
    shared_store: filesystem                # Ship indexes to the 'filesystem' store

compactor:                                # Explicitly configure the compactor
  working_directory: /tmp/loki/compactor  # <<< Crucial: Give the compactor its own directory
  shared_store: filesystem                # Tell compactor which store to compact
  compaction_interval: 10m                # How often to check for compaction
  retention_enabled: true                 # Enable retention within the compactor
  retention_delete_delay: 2h              # Delay before deleting after marking
  retention_delete_worker_count: 150      # Worker count for deletion

# ingester:
#   lifecycler:
#     ring:
#       kvstore:
#         store: inmemory
#       replication_factor: 1
#       # address: 127.0.0.1 # Not strictly needed for single node, but good practice
#   chunk_idle_period: 5m         # How long to wait before flushing an idle chunk
#   chunk_target_size: 1536000    # Target size 1.5MB
#   chunk_retain_period: 1m       # How long to keep chunks in memory after flushing
#   max_chunk_age: 1h             # Max age before flushing anyway
#   max_transfer_retries: 3       # Retries for shipping chunks
#   wal:
#     enabled: true
#     dir: /tmp/wal               # Write-Ahead Log directory
#     flush_on_shutdown: true     # Ensure WAL is flushed before shutdown
#     replay_memory_ceiling: 1GB  # Limit memory during WAL replay
ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
      # address: 127.0.0.1 # Not strictly needed for single node, but good practice
  chunk_idle_period: 5m         # How long to wait before flushing an idle chunk
  chunk_target_size: 1536000    # Target size 1.5MB
  chunk_retain_period: 1m       # How long to keep chunks in memory after flushing
  max_chunk_age: 1h             # Max age before flushing anyway
  max_transfer_retries: 0       # <-- CHANGE THIS FROM 3 TO 0
  wal:
    enabled: true
    dir: /loki/data/wal         # Assuming you took the advice to use a persistent path
    flush_on_shutdown: true     # Ensure WAL is flushed before shutdown
    replay_memory_ceiling: 1GB  # Limit memory during WAL replay

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h # 7 days
  # Add some basic rate limits to prevent accidental overloads
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_streams_per_user: 0 # Unlimited for single user setup
  max_global_streams_per_user: 0 # Unlimited for single user setup

chunk_store_config:
  max_look_back_period: 0s # Set to your retention period if using chunk store retention

table_manager:
  retention_deletes_enabled: